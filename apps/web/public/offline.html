<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070b" />
    <meta name="color-scheme" content="dark" />
    <title>Offline | Waylit</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <!--
      Self contained on purpose: no scripts and no external files other than the icon, so the
      service worker can cache it at install and show it with no network. The --wl-* values
      are copied from packages/ui-tokens and a test fails if they drift.
    -->
    <style>
      :root {
        --wl-color-night-950: #05070b;
        --wl-color-night-800: #12161c;
        --wl-color-cyan: #5fc8e8;
        --wl-color-cyan-soft: #a5dff0;
        --wl-color-text: #eef1f4;
        --wl-color-text-secondary: #a4acb7;
        --wl-color-text-muted: #747d89;
        --wl-color-glass: rgba(10, 13, 18, 0.85);
        --wl-color-glass-border: rgba(255, 255, 255, 0.1);
        --wl-font-sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
        --wl-radius-md: 12px;
        --wl-radius-lg: 20px;
        --wl-glow-focus: 0 0 0 3px rgba(95, 200, 232, 0.6);
      }
      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: dark;
        background: var(--wl-color-night-950);
        color: var(--wl-color-text);
        font-family: var(--wl-font-sans);
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        background:
          radial-gradient(60rem 28rem at 50% 0%, rgba(95, 200, 232, 0.08), transparent 70%),
          var(--wl-color-night-950);
      }
      main {
        width: min(100%, 32rem);
        padding: 1.5rem;
        background: var(--wl-color-glass);
        border: 1px solid var(--wl-color-glass-border);
        border-radius: var(--wl-radius-lg);
      }
      .mark {
        display: block;
        width: 3rem;
        height: 3rem;
        border-radius: var(--wl-radius-md);
      }
      h1 {
        margin: 1rem 0 0;
        font-size: 1.5625rem;
        line-height: 1.3;
        font-weight: 600;
      }
      p {
        margin: 0.5rem 0 0;
        font-size: 1rem;
        line-height: 1.5;
        color: var(--wl-color-text-secondary);
      }
      .hint {
        font-size: 0.875rem;
        color: var(--wl-color-text-muted);
      }
      a.retry {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        margin-top: 1.5rem;
        padding: 0 1.25rem;
        border-radius: var(--wl-radius-md);
        background: var(--wl-color-cyan);
        color: var(--wl-color-night-950);
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
      }
      a.retry:hover {
        background: var(--wl-color-cyan-soft);
      }
      a.retry:focus-visible {
        outline: none;
        box-shadow: var(--wl-glow-focus);
      }
      @media (max-height: 520px) {
        main {
          padding: 1rem 1.25rem;
        }
        a.retry {
          margin-top: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/icon.svg" alt="" width="48" height="48" />
      <h1>You are offline</h1>
      <p>
        Waylit could not reach the network, and this page has not been saved on your device yet.
        Connect and try again.
      </p>
      <p class="hint">
        Pages you have already opened open without a connection. Waylit is a navigation aid, not a
        safety system.
      </p>
      <a class="retry" href="/">Try again</a>
    </main>
  </body>
</html>
