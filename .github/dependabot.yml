version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"

  # Add the npm ecosystem here when the first package.json lands, for example:
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   target-branch: "dev"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "chore(deps)"
