name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Required community files exist
        run: |
          missing=0
          for f in LICENSE NOTICE README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md SUPPORT.md CHANGELOG.md AGENTS.md .env.example .gitignore .editorconfig .github/CODEOWNERS .github/PULL_REQUEST_TEMPLATE.md docs/THIRD_PARTY.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done
          exit $missing

      - name: No committed environment files
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Environment files must not be committed:"
            echo "$bad"
            exit 1
          fi

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Detect application code
        id: detect
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable pnpm
        if: steps.detect.outputs.present == 'true'
        run: corepack enable

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Format
        if: steps.detect.outputs.present == 'true'
        run: pnpm format:check

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: pnpm test

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: pnpm build

  layout:
    name: Layout check (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Start the app
        run: |
          pnpm --filter @waylit/web start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000/ride > /dev/null; then exit 0; fi
            sleep 2
          done
          cat server.log
          exit 1

      # Chrome is preinstalled on the GitHub runner. The check fails if anything covers the
      # credits strip, HUD parts overlap, a target is under 44 pixels or the text loses contrast.
      - name: Layout check
        run: node apps/web/scripts/layout-check.mjs

      - name: Layout check with a fake credits strip
        run: FAKE_CREDITS=1 node apps/web/scripts/layout-check.mjs

      - name: Layout check, free ride on live GPS
        run: GPS=live node apps/web/scripts/layout-check.mjs

      - name: Layout check, free ride on the replay trace
        run: GPS=replay node apps/web/scripts/layout-check.mjs
